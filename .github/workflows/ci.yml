name: DriveNX CI

# Testpakete bewusst nur auf Anforderung bauen, nicht bei jedem Commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Checks and package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            command: npm run release:win
          - name: macos-arm64
            os: macos-15
            command: bash scripts/build-mac-ci.sh
          - name: linux-x64
            os: ubuntu-22.04
            command: npm run dist:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # macOS-Testpakete werden vollständig Ad-hoc-signiert, jedoch NICHT notarisiert.
      # Die offizielle Developer-ID-Signierung erhält später einen getrennten Freigabepfad.
      - name: Validate, package and smoke-test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.command }}
      # archive: false unterstützt pro Upload nur genau eine Datei.
      # Die Namen der Dateien werden automatisch als Artefaktnamen verwendet.
      - name: Upload Windows installer
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          path: release/DriveNX-Setup-*-x64.exe
          archive: false
          if-no-files-found: error
          retention-days: 5
      - name: Upload Windows portable
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          path: release/DriveNX-Portable-*-x64.exe
          archive: false
          if-no-files-found: error
          retention-days: 5
      - name: Upload macOS DMG
        if: matrix.name == 'macos-arm64'
        uses: actions/upload-artifact@v7
        with:
          path: release/*.dmg
          archive: false
          if-no-files-found: error
          retention-days: 5
      - name: Upload macOS ZIP
        if: matrix.name == 'macos-arm64'
        uses: actions/upload-artifact@v7
        with:
          path: release/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 5
      - name: Upload Linux AppImage
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          path: release/*-linux-*.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 5
      - name: Upload Linux DEB
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          path: release/*-linux-*.deb
          archive: false
          if-no-files-found: error
          retention-days: 5

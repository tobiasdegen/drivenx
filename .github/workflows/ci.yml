name: DriveNX CI

# Testpakete bewusst nur auf Anforderung bauen, nicht bei jedem Commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Checks and package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            command: npm run release:win
            artifacts: |
              release/DriveNX-Setup-*-x64.exe
              release/DriveNX-Portable-*-x64.exe
          - name: macos-arm64
            os: macos-15
            command: bash scripts/build-mac-ci.sh
            artifacts: |
              release/*.dmg
              release/*.zip
          - name: linux-x64
            os: ubuntu-22.04
            command: npm run dist:linux
            artifacts: |
              release/*-linux-*.AppImage
              release/*-linux-*.deb
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # macOS-Testpakete werden vollständig Ad-hoc-signiert, jedoch NICHT notarisiert.
      # Die offizielle Developer-ID-Signierung erhält später einen getrennten Freigabepfad.
      - name: Validate, package and smoke-test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.command }}
      - name: Upload test artifacts
        uses: actions/upload-artifact@v6
        with:
          name: drivenx-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 5
